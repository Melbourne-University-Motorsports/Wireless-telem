services:

  can-reader:
    build:
      context: .
      dockerfile: services/can-reader/Dockerfile
    depends_on: [broker]
    devices: []
    volumes:
      - ./dbc:/app/dbc:ro
    environment:
      - CRITICAL_CAN_INTERFACE=can0
      - NONCRITICAL_CAN_INTERFACE=can1
      - DBC_PATH=/app/dbc/CAN_2024.dbc
    restart: always

  can-simulator:
    build:
      context: .
      dockerfile: services/can-simulator/Dockerfile
    profiles: [dev]
    depends_on: [broker]
    volumes:
      - ./dbc:/app/dbc:ro
    environment:
      - CRITICAL_CAN_INTERFACE=can0
      - NONCRITICAL_CAN_INTERFACE=can1
      - DBC_PATH=/app/dbc/CAN_2024.dbc
    restart: always

  broker:
    build:
      context: .
      dockerfile: services/broker/Dockerfile
    restart: always

  sd-logger:
    build:
      context: .
      dockerfile: services/sd-logger/Dockerfile
    depends_on: [broker]
    environment:
      - LOG_DIR=/telemetry_logs
      - DBC_PATH=/app/dbc/CAN_2024.dbc
      - BROKER_PORT=5560
    volumes:
      - ./dbc:/app/dbc:ro
      - ./mnt/telemetry_logs:/telemetry_logs
    restart: always

  rf-sender:
    build:
      context: .
      dockerfile: services/rf-sender/Dockerfile
    depends_on: [broker]
    environment:
      - DBC_FILE_PATH=/app/dbc-files/telemetry_can.dbc
    volumes:
      - ./dbc:/app/dbc:ro
    restart: always
